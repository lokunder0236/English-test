<!doctype html>

<title>English CAE Practice</title>
<style>

  }

    :root {
      --bg: #14161c; --card: #1e2129; --text: #e8eaf0; --muted: #9aa0b0;
      --accent: #7b93ff; --ok: #69db7c; --ok-bg: #1d3324; --bad: #ff8787; --bad-bg: #3a1f22;
      --border: #333846;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; justify-content: center; padding: 24px 16px; min-height: 100vh;
  }
  .wrap { width: 100%; max-width: 560px; }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; font-size: .95rem; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 22px; margin-bottom: 16px;
  }
  .modes { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  button {
    font: inherit; cursor: pointer; border-radius: 10px; border: 1px solid var(--border);
    background: var(--card); color: var(--text); padding: 12px 16px;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button:hover { filter: brightness(1.05); }
  .mode-btn { text-align: left; padding: 16px; }
  .mode-btn strong { display: block; font-size: 1.05rem; margin-bottom: 4px; }
  .mode-btn span { color: var(--muted); font-size: .88rem; }
  .top { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: .9rem; margin-bottom: 10px; }
  .bar { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; margin-bottom: 18px; }
  .bar > div { height: 100%; background: var(--accent); width: 0; transition: width .25s; }
  .label { color: var(--muted); font-size: .8rem; text-transform: uppercase; letter-spacing: .05em; }
  .word { font-size: 2rem; font-weight: 700; margin: 4px 0 4px; }
  .cat { color: var(--muted); font-size: .9rem; margin-bottom: 18px; min-height: 1.2em; }
  .hint { font-family: ui-monospace, Menlo, monospace; color: var(--accent); font-size: 1.1rem; margin-bottom: 8px; }
  input[type=text] {
    width: 100%; font: inherit; font-size: 1.15rem; padding: 12px 14px; border-radius: 10px;
    border: 2px solid var(--border); background: var(--bg); color: var(--text); outline: none;
  }
  input[type=text]:focus { border-color: var(--accent); }
  .row { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
  .row button { flex: 1; }
  .feedback { margin-top: 14px; padding: 12px 14px; border-radius: 10px; display: none; }
  .feedback.ok { display: block; background: var(--ok-bg); color: var(--ok); }
  .feedback.bad { display: block; background: var(--bad-bg); color: var(--bad); }
  .feedback b { color: var(--text); }
  .score { font-size: 2.4rem; font-weight: 700; margin: 6px 0; }
  table { width: 100%; border-collapse: collapse; font-size: .92rem; margin-top: 10px; }
  td, th { padding: 7px 6px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; }
  th { color: var(--muted); font-weight: 500; }
  .wrong { color: var(--bad); text-decoration: line-through; }
  .opts { margin-top: 14px; display: flex; gap: 14px; flex-wrap: wrap; color: var(--muted); font-size: .9rem; }
  .hidden { display: none; }
  .sets { display: grid; gap: 8px; margin: 8px 0 0; }
  .set-btn { text-align: left; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .set-btn span { color: var(--muted); font-size: .85rem; }
  .setdesc { font-size: .85rem; color: var(--muted); margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
  .group { font-weight: 700; margin: 10px 0 0; }
  .set-btn.active { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent) inset; }
  .word.long { font-size: 1.35rem; font-weight: 600; }
  .cat.instr { color: var(--accent); font-weight: 600; font-size: 1rem; }
  .diff { margin-top: 8px; color: var(--text); }
  .diff .wrong { text-decoration: none; background: var(--bad-bg); color: var(--bad); font-weight: 600; border-bottom: 2px solid var(--bad); }
</style>
</head>
<body>
<div class="wrap">

    <div class="sets" id="sets"></div>

    <div class="modes">

      <button class="mode-btn" data-mode="hard"><strong>🔴 Difícil</strong><span>Sin pistas</span></button>

    <div class="opts">

      <label><input type="checkbox" id="onlyWrong"> Solo las que fallé la última vez</label>
    </div>
  </div>

  <!-- Juego -->
  <div id="game" class="card hidden">
    <div class="setdesc" id="setDesc"></div>
    <div class="top"><span id="progress"></span><span id="scoreLive"></span></div>
    <div class="bar"><div id="barFill"></div></div>
    <div class="label" id="promptLabel">Informal</div>
    <div class="word" id="word"></div>
    <div class="cat" id="cat"></div>
    <div class="label" id="answerLabel">Formal</div>
    <div class="hint" id="hint"></div>
    <input type="text" id="answer" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Escribe la respuesta…">
    <div class="row">
      <button id="checkBtn" class="primary">Comprobar</button>
      <button id="skipBtn">No lo sé</button>
    </div>
    <div class="feedback" id="feedback"></div>
    <div class="row"><button id="quitBtn">Terminar</button></div>
  </div>

  <!-- Resultado -->
  <div id="result" class="card hidden">
    <div class="label">Resultado</div>
    <div class="score" id="finalScore"></div>
    <div id="mistakes"></div>
    <div class="row">
      <button id="retryWrong" class="primary">Repetir las falladas</button>
      <button id="backBtn">Volver al inicio</button>
    </div>
  </div>
</div>

// Cleft sentences: [original, tipo, foco/inicio, respuesta(s), pista]
// {a|b} = cualquiera de las dos; "||" separa respuestas alternativas completas
const CLEFT_RAW = [
  ["Tom took Sally to the party on Saturday.", "it", "Tom", "It was Tom {who|that} took Sally to the party on Saturday.", "It was Tom …"],
  ["Tom took Sally to the party on Saturday.", "it", "Sally", "It was Sally {that|who|whom} Tom took to the party on Saturday.", "It was Sally …"],

  ["Tom took Sally to the party on Saturday.", "it", "on Saturday", "It was on Saturday {that|when} Tom took Sally to the party.", "It was on Saturday …"],

function expand(t) {
  return t.split("||").flatMap(alt => {
    let out = [""];
    alt.split(/(\{[^}]*\})/).forEach(part => {
      const choices = part.startsWith("{") ? part.slice(1, -1).split("|") : [part];
      out = out.flatMap(o => choices.map(c => o + c));
    });
    return out.map(x => x.trim());
  });
}
const CLEFT_TYPE = {
  it: f => `IT-cleft · destaca: «${f}»`,
  what: () => "WHAT-cleft · destaca la acción",
  be: () => "WHAT-cleft (verbo TO BE) · destaca la descripción",
  other: f => `Empieza con «${f}…»`,
};
const CLEFTS = CLEFT_RAW.map(([orig, type, focus, ans, hint]) => {
  const all = expand(ans);
  const shown = ans.split("||")[0].replace(/\{([^|}]*)[^}]*\}/g, "$1");
  return [orig, shown, CLEFT_TYPE[type](focus), { answers: all, hint }];
});

  ["If I hadn't chosen to learn English, I wouldn't be doing this exercise right now.", "Had I not chosen to learn English, I wouldn't be doing this exercise right now."],

// Pista fácil: muestra las primeras n palabras y la primera letra de la siguiente
function sentenceHint(ans, n) {
  const words = ans.split("||")[0].replace(/\{([^|}]*)[^}]*\}/g, "$1").split(" ");
  const next = words[n] || "";
  return [...words.slice(0, n), next ? next[0] + " _".repeat(next.replace(/[^A-Za-z]/g, "").length - 1) : ""].join(" ").trim() + " …";
}
const makeSentence = (orig, ans, instr, hint) =>
  [orig, ans.split("||")[0].replace(/\{([^|}]*)[^}]*\}/g, "$1"), instr, { answers: expand(ans), hint }];
const INVERSIONS = INVERSION_RAW.map(([orig, start, ans]) =>
  makeSentence(orig, ans, `Empieza con «${start}…»`, sentenceHint(ans, start.split(" ").length)));
const CONDITIONALS = CONDITIONAL_RAW.map(([orig, ans]) =>
  makeSentence(orig, ans, "Quita el IF e invierte el condicional", sentenceHint(ans, 0)));

// Opposites: [palabra, contrario, catalán palabra, catalán contrario]
const OPP_RAW = [

// [original, empezar con, respuesta(s)]
const PARTICIPLE_RAW = [

const PARTICIPLES = PARTICIPLE_RAW.map(([o, st, a]) => makeSentence(o, a, `Participle clause · empieza con «${st}…»`, sentenceHint(a, st.split(" ").length)));
const PASSIVES = PASSIVE_RAW.map(([o, st, a]) => makeSentence(o, a, `Pásala a pasiva · empieza con «${st}…»`, sentenceHint(a, st.split(" ").length)));
const IMPERSONALS = IMPERSONAL_RAW.map(([o, v, st, a]) => makeSentence(o, a, `Usa «${v}» · empieza con «${st}…»`, sentenceHint(a, st.split(" ").length)));

const SETS = {
  formal:  { name: "Informal → Formal", desc: "Te doy la palabra informal y tú escribes la formal.", items: WORDS, prompt: "Informal", answer: "Formal", extraIsCat: true },
  verbs:   { name: "Key Verbs", desc: "Te doy el sinónimo y tú escribes el key verb.", items: KEY_VERBS, prompt: "Sinónimo", answer: "Key verb", long: false },
  reviews: { name: "Vocabulary for Reviews", desc: "Te doy la definición en catalán y tú escribes la palabra en inglés.", items: REVIEWS, prompt: "Definición", answer: "Palabra en inglés", long: true },
  opposites: { name: "Opposites", desc: "Te doy un adjetivo y tú escribes su contrario.", items: OPPOSITES, prompt: "Palabra", answer: "Contrario", extraIsCat: true },
  inversion: { name: "Inversion", desc: "Reescribe la frase con inversión, empezando por la expresión que te indico.", items: INVERSIONS, prompt: "Frase normal", answer: "Con inversión", long: true, unit: "frases" },
  conditionals: { name: "Inverted Conditionals", desc: "Quita el IF y escribe el condicional invertido (Should / Were / Had).", items: CONDITIONALS, prompt: "Frase con IF", answer: "Condicional invertido", long: true, unit: "frases" },
  participle: { name: "Participle Clauses", desc: "Une o acorta la frase con una participle clause (-ing, Having + V3, V3).", items: PARTICIPLES, prompt: "Frase original", answer: "Participle clause", long: true, unit: "frases" },
  passive: { name: "Passive", desc: "Pasa la frase de activa a pasiva.", items: PASSIVES, prompt: "Activa", answer: "Pasiva", long: true, unit: "frases" },
  impersonal: { name: "Impersonal Passive", desc: "Reescribe la frase con impersonal passive (is said to… / It is said that…).", items: IMPERSONALS, prompt: "Frase original", answer: "Impersonal passive", long: true, unit: "frases" },
  cleft:   { name: "Cleft Sentences", desc: "Transforma la frase en una cleft sentence (It / What / All / The thing that…).", items: CLEFTS, prompt: "Frase original", answer: "Cleft sentence", long: true, unit: "frases" },
};
let setId = "formal";
try { if (SETS[localStorage.getItem("setId")]) setId = localStorage.getItem("setId"); } catch {}

function renderSets() {
  const GRAMMAR_START = "inversion";
  $("sets").innerHTML = Object.entries(SETS).map(([id, st]) =>
    (id === "formal" ? `<div class="group">📚 Vocabulary</div>` : id === GRAMMAR_START ? `<div class="group">✏️ Grammar</div>` : "") +
    `<button class="set-btn${id === setId ? " active" : ""}" data-set="${id}"><strong>${st.name}</strong><span>${st.items.length} ${st.unit || "palabras"}</span></button>`).join("");
  $("sets").querySelectorAll(".set-btn").forEach(b => b.addEventListener("click", () => {
    setId = b.dataset.set; try { localStorage.setItem("setId", setId); } catch {}
    renderSets();
  }));
  $("showCatLabel").classList.toggle("hidden", !SETS[setId].extraIsCat);
}

// Normaliza: minúsculas, sin espacios extra, sin puntuación final, y acepta ortografía americana (-ize, favorable)
function norm(s) {
  return s.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim()
    .replace(/[.!?;:…]+$/g, "")
    .replace(/,/g, "")
    .replace(/\s+/g, " ")
    .replace(/[’`]/g, "'")
    .replace(/\bwon't\b/g, "will not").replace(/\bcan't\b/g, "can not").replace(/\bcannot\b/g, "can not")
    .replace(/n't\b/g, " not").replace(/\bi'm\b/g, "i am")
    .replace(/\s*-\s*/g, "-")
    .replace(/iz(e|ed|ing)\b/g, "is$1")
    .replace(/favorable/g, "favourable");
}
const options = w => w[3] ? w[3].answers : w[1].split("/").map(s => s.trim());
const itemKey = w => w[0] + "|" + (w[3] ? w[2] : "");

const $ = id => document.getElementById(id);
let mode = "easy", queue = [], idx = 0, correct = 0, mistakes = [], answered = false;

function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
const wrongKey = () => setId === "formal" ? "wrongWords" : "wrongWords_" + setId;
function loadWrong() { try { return JSON.parse(localStorage.getItem(wrongKey()) || "[]"); } catch { return []; } }
function saveWrong(list) { try { localStorage.setItem(wrongKey(), JSON.stringify(list)); } catch {} }

function startGame(list) {
  queue = shuffle(list); idx = 0; correct = 0; mistakes = [];
  const st = SETS[setId];
  $("setDesc").textContent = st.name + " · " + st.desc;
  $("promptLabel").textContent = st.prompt; $("answerLabel").textContent = st.answer;
  $("word").classList.toggle("long", !!st.long);
  $("start").classList.add("hidden"); $("result").classList.add("hidden"); $("game").classList.remove("hidden");
  show();
}

function hintFor(w) {
  if (w[3]) return w[3].hint;
  // Primera letra de cada opción, con guiones según la longitud de cada palabra
  return options(w).map(o =>
    o.split(" ").map((part, i) => {
      const letters = part.split("").map(c => c === "-" ? "-" : "_");
      if (i === 0) letters[0] = part[0];
      return letters.join(" ");
    }).join("   ")
  ).join("   o   ");
}

function show() {
  const w = queue[idx];
  answered = false;
  $("progress").textContent = `Pregunta ${idx + 1} de ${queue.length}`;
  $("scoreLive").textContent = `✔ ${correct}`;
  $("barFill").style.width = (idx / queue.length * 100) + "%";
  $("word").textContent = w[0];
  const st = SETS[setId];
  $("cat").classList.toggle("instr", !!w[3]);
  $("cat").textContent = !w[2] ? "" : st.extraIsCat ? ($("showCat").checked ? "(" + w[2] + ")" : "") : w[2];
  $("hint").textContent = mode === "easy" ? hintFor(w) : "";
  $("hint").classList.toggle("hidden", mode !== "easy");
  $("answer").value = ""; $("answer").disabled = false; $("answer").focus();
  $("feedback").className = "feedback"; $("feedback").innerHTML = "";
  $("checkBtn").textContent = "Comprobar"; $("skipBtn").classList.remove("hidden");
}

function check(skip) {
  if (answered) { next(); return; }
  const w = queue[idx];
  const given = $("answer").value;
  if (!skip && !given.trim()) { $("answer").focus(); return; }
  answered = true;
  const ok = !skip && options(w).some(o => norm(o) === norm(given));
  const fb = $("feedback");
  if (ok) {
    correct++;
    fb.className = "feedback ok";
    fb.innerHTML = !w[3] && options(w).length > 1 ? `✅ ¡Correcto! También vale: <b>${w[1]}</b>` : "✅ ¡Correcto!";
  } else {
    mistakes.push({ w, given: skip ? "" : given });
    fb.className = "feedback bad";
    fb.innerHTML = (skip ? "La respuesta era: " : "❌ Incorrecto. La correcta es: ") + `<b>${w[1]}</b>` +
      (w[3] && !skip ? `<div class="diff">Tu respuesta: ${diffHtml(given, w)}</div>` : "");
  }
  $("answer").disabled = true;
  $("scoreLive").textContent = `✔ ${correct}`;
  $("checkBtn").textContent = idx + 1 < queue.length ? "Siguiente →" : "Ver resultado";
  $("skipBtn").classList.add("hidden");
  $("checkBtn").blur(); $("answer").blur();
}

function next() {
  idx++;
  if (idx < queue.length) show(); else finish();
}

function finish() {
  const done = Math.min(queue.length, answered ? idx + 1 : idx);
  $("game").classList.add("hidden"); $("result").classList.remove("hidden");
  const pct = done ? Math.round(correct / done * 100) : 0;
  $("finalScore").textContent = `${correct} / ${done}  (${pct}%)`;
  saveWrong(mistakes.map(m => itemKey(m.w)));
  if (mistakes.length) {
    $("mistakes").innerHTML = `<div class='label' style='margin-top:12px'>Para repasar</div><table><tr><th>${SETS[setId].prompt}</th><th>Tu respuesta</th><th>Correcta</th></tr>` +
      mistakes.map(m => `<tr><td>${m.w[0]}</td><td>${m.given ? (m.w[3] ? `<span class="diff">${diffHtml(m.given, m.w)}</span>` : `<span class="wrong">${escapeHtml(m.given)}</span>`) : "—"}</td><td><b>${m.w[1]}</b></td></tr>`).join("") +
      "</table>";
    $("retryWrong").classList.remove("hidden");
  } else {
    $("mistakes").innerHTML = done ? "<p>🎉 ¡Ninguna fallada!</p>" : "";
    $("retryWrong").classList.add("hidden");
  }
}
// Marca en rojo las palabras de tu respuesta que no encajan con la respuesta correcta más parecida
function diffHtml(given, w) {
  const tok = x => x.trim().split(/\s+/).filter(Boolean);
  const g = tok(given);
  let best = null;
  options(w).forEach(o => {
    const c = tok(o), n = g.length, m = c.length;
    const L = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
    for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
      L[i][j] = norm(g[i]) === norm(c[j]) ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
    if (!best || L[0][0] > best.L[0][0]) best = { L, c };
  });
  const { L, c } = best, keep = new Set();
  let i = 0, j = 0;
  while (i < g.length && j < c.length) {
    if (norm(g[i]) === norm(c[j])) { keep.add(i); i++; j++; }
    else if (L[i + 1][j] >= L[i][j + 1]) i++; else j++;
  }
  return g.map((t, k) => keep.has(k) ? escapeHtml(t) : `<span class="wrong">${escapeHtml(t)}</span>`).join(" ");
}
function escapeHtml(s) { return s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

document.querySelectorAll(".mode-btn").forEach(b => b.addEventListener("click", () => {
  mode = b.dataset.mode;
  const ALL = SETS[setId].items;
  let list = ALL;
  if ($("onlyWrong").checked) {
    const wrong = loadWrong();
    const filtered = ALL.filter(w => wrong.includes(itemKey(w)));
    if (filtered.length) list = filtered; else alert("No hay palabras falladas guardadas. Empiezo con todas.");
  }
  startGame(list);
}));
$("checkBtn").addEventListener("click", () => check(false));
$("skipBtn").addEventListener("click", () => check(true));
$("answer").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); e.stopPropagation(); check(false); } });
document.addEventListener("keydown", e => { if (e.key === "Enter" && answered && !$("game").classList.contains("hidden")) { e.preventDefault(); next(); } });
$("quitBtn").addEventListener("click", finish);
$("retryWrong").addEventListener("click", () => startGame(mistakes.map(m => m.w)));
$("backBtn").addEventListener("click", () => { $("result").classList.add("hidden"); $("start").classList.remove("hidden"); });
renderSets();
</script>
